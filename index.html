<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品上架與首頁展示</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Firebase App 與 Firestore SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase 專案設定
        const firebaseConfig = {
            apiKey: "AIzaSyCq2RtHFB1R_uXbgrAJQ2GWRxAMZS5ij8E",
            authDomain: "pigtrade.firebaseapp.com",
            projectId: "pigtrade",
            storageBucket: "pigtrade.firebasestorage.app",
            messagingSenderId: "942025449499",
            appId: "1:942025449499:web:321544b845d15c8b46d8be",
            measurementId: "G-EW5J9KD2R8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let selectedCategory = '貼圖';
        let allProducts = [];
        let canvas, ctx, isDrawing = false, originalImage = null;

        // 初始化畫布監聽
        window.addEventListener('DOMContentLoaded', () => {
            canvas = document.getElementById('mask-canvas');
            if (canvas) {
                ctx = canvas.getContext('2d');
                
                canvas.addEventListener('mousedown', startDrawing);
                canvas.addEventListener('mousemove', draw);
                canvas.addEventListener('mouseup', stopDrawing);
                canvas.addEventListener('mouseleave', stopDrawing);

                canvas.addEventListener('touchstart', handleTouch);
                canvas.addEventListener('touchmove', handleTouch);
                canvas.addEventListener('touchend', stopDrawing);
            }
            loadProducts();
        });

        // 分類切換邏輯
        window.setCategory = function(cat) {
            selectedCategory = cat;
            ['貼圖', '遊戲', '超商', '其它'].forEach(c => {
                const btn = document.getElementById(`cat-${c}`);
                if (btn) {
                    if (c === cat) {
                        btn.className = "flex-1 py-2 bg-orange-500 text-white rounded font-medium transition";
                    } else {
                        btn.className = "flex-1 py-2 bg-gray-100 text-gray-700 rounded font-medium hover:bg-gray-200 transition";
                    }
                }
            });
            renderProducts();
        };

        // 圖片上傳與預覽初始化畫布
        window.handleImageUpload = function(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                originalImage = new Image();
                originalImage.onload = function() {
                    canvas.width = originalImage.width;
                    canvas.height = originalImage.height;
                    ctx.drawImage(originalImage, 0, 0);
                    document.getElementById('preview-container').classList.remove('hidden');
                };
                originalImage.src = e.target.result;
            };
            reader.readAsDataURL(file);
        };

        window.clearImage = function() {
            document.getElementById('file-input').value = '';
            document.getElementById('preview-container').classList.add('hidden');
            if (ctx && originalImage) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(originalImage, 0, 0);
            }
        };

        // 畫布繪圖邏輯（紅筆遮蔽）
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
            const clientY = e.clientY || (e.touches ? e.touches[0].clientY : 0);
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function startDrawing(e) {
            isDrawing = true;
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        }

        function draw(e) {
            if (!isDrawing) return;
            const pos = getPos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.strokeStyle = '#ef4444'; // 紅色
            ctx.lineWidth = Math.max(canvas.width * 0.03, 10);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
        }

        function stopDrawing() {
            isDrawing = false;
        }

        function handleTouch(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const mouseEvent = new MouseEvent(e.type === 'touchstart' ? 'mousedown' : e.type === 'touchmove' ? 'mousemove' : 'mouseup', {
                clientX: touch.clientX,
                clientY: touch.clientY
            });
            canvas.dispatchEvent(mouseEvent);
        }

        // 上架商品至 Firestore
        window.submitProduct = async function() {
            const name = document.getElementById('prod-name').value.trim();
            const price = Number(document.getElementById('prod-price').value);
            const description = document.getElementById('prod-desc').value.trim();
            const btn = document.getElementById('submit-btn');

            if (!originalImage) {
                alert('請先上傳商品圖片');
                return;
            }
            if (!name) {
                alert('請輸入商品名稱');
                return;
            }
            if (isNaN(price) || price < 100 || price > 30000) {
                alert('商品價格必須在 100 至 30000 之間');
                return;
            }

            const maskedImageBase64 = canvas.toDataURL('image/jpeg', 0.85);

            btn.disabled = true;
            btn.innerText = '上架中...';

            try {
                await addDoc(collection(db, "products"), {
                    category: selectedCategory,
                    name: name,
                    price: price,
                    description: description,
                    maskedImage: maskedImageBase64,
                    status: 'pending',
                    createdAt: serverTimestamp()
                });
                alert('商品上架成功！');
                window.clearImage();
                document.getElementById('prod-name').value = '';
                document.getElementById('prod-price').value = '';
                document.getElementById('prod-desc').value = '';
                loadProducts();
            } catch (error) {
                console.error("寫入資料庫失敗：", error);
                alert('上架失敗，請稍後再試。');
            } finally {
                btn.disabled = false;
                btn.innerText = '確認上架';
            }
        };

        // 從 Firestore 載入商品
        async function loadProducts() {
            try {
                const q = query(collection(db, "products"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                allProducts = [];
                querySnapshot.forEach((doc) => {
                    allProducts.push({ id: doc.id, ...doc.data() });
                });
                renderProducts();
            } catch (error) {
                console.error("讀取商品失敗：", error);
            }
        }

        // 渲染商品列表
        function renderProducts() {
            const container = document.getElementById('product-list');
            const filtered = allProducts.filter(p => p.category === selectedCategory);
            
            if (filtered.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center text-gray-400 py-8">目前尚無 ${selectedCategory} 類別的商品</div>`;
                return;
            }

            container.innerHTML = filtered.map(p => `
                <div class="bg-white rounded-lg shadow border p-4 flex flex-col justify-between">
                    <div>
                        <img src="${p.maskedImage}" alt="${p.name}" class="w-full h-40 object-cover rounded mb-3">
                        <span class="text-xs bg-orange-100 text-orange-600 px-2 py-1 rounded">${p.category}</span>
                        <h3 class="font-bold text-lg mt-2 text-gray-800">${p.name}</h3>
                        <p class="text-gray-600 text-sm mt-1 line-clamp-2">${p.description || '無使用說明'}</p>
                    </div>
                    <div class="mt-4 flex items-center justify-between">
                        <span class="text-red-500 font-bold text-lg">NT$ ${p.price}</span>
                        <button onclick="openDetailModal('${p.id}')" class="bg-orange-500 text-white px-3 py-1.5 rounded text-sm hover:bg-orange-600 transition">查看詳情</button>
                    </div>
                </div>
            `).join('');
        }

        // 開啟詳情 Modal
        window.openDetailModal = function(id) {
            const product = allProducts.find(p => p.id === id);
            if (!product) return;

            document.getElementById('modal-img').src = product.maskedImage;
            document.getElementById('modal-category').innerText = product.category;
            document.getElementById('modal-name').innerText = product.name;
            document.getElementById('modal-price').innerText = `NT$ ${product.price}`;
            document.getElementById('modal-desc').innerText = product.description || '無使用說明';
            document.getElementById('modal-status').innerText = product.status === 'pending' ? '狀態：審核中' : '狀態：上架中';

            document.getElementById('detail-modal').classList.remove('hidden');
        };

        // 關閉詳情 Modal
        window.closeDetailModal = function() {
            document.getElementById('detail-modal').classList.add('hidden');
        };
    </script>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-8">
        <!-- 上架表單區塊 -->
        <div class="bg-white p-6 rounded-xl shadow-md">
            <h2 class="text-xl font-bold text-gray-800 mb-4">商品上架與序號遮蔽</h2>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">商品序號圖片</label>
                <input type="file" id="file-input" accept="image/*" onchange="handleImageUpload(event)" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-orange-50 file:text-orange-700 hover:file:bg-orange-100"/>
            </div>

            <!-- 繪圖預覽容器 -->
            <div id="preview-container" class="hidden mb-4 border border-dashed border-gray-300 p-4 rounded text-center">
                <p class="text-xs text-gray-500 mb-2">請直接在下方圖片上用滑鼠塗鴉遮蔽敏感序號：</p>
                <div class="relative inline-block max-w-full overflow-hidden border rounded">
                    <canvas id="mask-canvas" class="cursor-crosshair max-h-64 block mx-auto"></canvas>
                </div>
                <div class="mt-2">
                    <button onclick="clearImage()" class="text-xs bg-gray-200 text-gray-700 px-3 py-1 rounded hover:bg-gray-300">重置畫布/清除塗鴉</button>
                </div>
            </div>

            <!-- 商品類別 -->
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">商品類別</label>
                <div class="flex gap-2">
                    <button type="button" id="cat-貼圖" onclick="setCategory('貼圖')" class="flex-1 py-2 bg-orange-500 text-white rounded font-medium transition">貼圖</button>
                    <button type="button" id="cat-遊戲" onclick="setCategory('遊戲')" class="flex-1 py-2 bg-gray-100 text-gray-700 rounded font-medium hover:bg-gray-200 transition">遊戲</button>
                    <button type="button" id="cat-超商" onclick="setCategory('超商')" class="flex-1 py-2 bg-gray-100 text-gray-700 rounded font-medium hover:bg-gray-200 transition">超商</button>
                    <button type="button" id="cat-其它" onclick="setCategory('其它')" class="flex-1 py-2 bg-gray-100 text-gray-700 rounded font-medium hover:bg-gray-200 transition">其它</button>
                </div>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">商品名稱</label>
                <input type="text" id="prod-name" class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-orange-500" placeholder="請輸入商品名稱">
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">商品價格 (100 - 30000)</label>
                <input type="number" id="prod-price" class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-orange-500" placeholder="100">
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-1">使用說明</label>
                <textarea id="prod-desc" rows="3" class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-orange-500" placeholder="請輸入說明"></textarea>
            </div>

            <button id="submit-btn" onclick="submitProduct()" class="w-full bg-orange-500 text-white py-3 rounded-lg font-bold hover:bg-orange-600 transition shadow">確認上架</button>
        </div>

        <!-- 首頁商品展示牆區塊 -->
        <div class="bg-white p-6 rounded-xl shadow-md">
            <h2 class="text-xl font-bold text-gray-800 mb-4">商品展示牆</h2>
            <div id="product-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                <!-- 動態載入商品 -->
            </div>
        </div>
    </div>

    <!-- 商品詳情 Modal 視窗 -->
    <div id="detail-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl relative">
            <button onclick="closeDetailModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
            <img id="modal-img" class="w-full h-64 object-cover rounded-xl" />
            <div class="flex items-center justify-between">
                <span id="modal-category" class="text-xs bg-orange-100 text-orange-600 px-2.5 py-1 rounded-full font-medium"></span>
                <span id="modal-status" class="text-xs text-gray-500"></span>
            </div>
            <h3 id="modal-name" class="text-xl font-bold text-gray-800"></h3>
            <p id="modal-desc" class="text-gray-600 text-sm bg-gray-50 p-3 rounded-lg"></p>
            <div class="flex items-center justify-between pt-2 border-t">
                <span id="modal-price" class="text-red-500 font-bold text-2xl"></span>
                <button onclick="alert('模擬兌換功能開發中！')" class="bg-orange-500 text-white px-5 py-2.5 rounded-xl font-bold hover:bg-orange-600 transition shadow">兌換商品</button>
            </div>
        </div>
    </div>

</body>
</html>
